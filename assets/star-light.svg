<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" role="img" aria-label="Please star the repo. It helps other people find first48.">
  <style>
    .star { fill: #bf8700; fill-opacity: 0; animation: star 4s ease-in-out infinite; }
    @keyframes star {
      0%, 45% { fill-opacity: 0; stroke: #1f2328; transform: scale(1); }
      55% { fill-opacity: 1; stroke: #bf8700; transform: scale(1.4); }
      65%, 88% { fill-opacity: 1; stroke: #bf8700; transform: scale(1); }
      100% { fill-opacity: 0; stroke: #1f2328; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .star { animation: none; } }
  </style>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="640" height="130" rx="14" fill="#f6f8fa"/>
    <text x="40" y="60" font-size="24" font-weight="700" fill="#1f2328">Please star the repo.</text>
    <text x="40" y="88" font-size="14" fill="#59636e">It helps other people find first48.</text>
    <rect x="470.5" y="41.5" width="129" height="47" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
    <g transform="translate(515 65)"><polygon class="star" points="0,-9 2.35,-3.24 8.56,-2.78 3.8,1.24 5.29,7.28 0,4 -5.29,7.28 -3.8,1.24 -8.56,-2.78 -2.35,-3.24" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/></g>
    <text x="535" y="71" font-size="16" font-weight="600" fill="#1f2328">Star</text>
  </g>
</svg>
