name: tests

on:
  push:
    paths-ignore:
      - "collector_runs.csv"
      - "monitoring/**"
      - "*.md"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-model.txt mlflow==3.17.2
      - run: pytest -q
