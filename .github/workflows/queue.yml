name: queue

on:
  workflow_dispatch:
    inputs:
      after:
        description: Run id of the collection run that asked for this one
        required: false
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AFTER: ${{ inputs.after }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m first48.queue_runs
