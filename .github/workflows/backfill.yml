name: backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: First cohort day (YYYY-MM-DD)
        required: true
      end:
        description: Last cohort day (YYYY-MM-DD)
        required: true
      bundle:
        description: Upload one compressed file for the month to the backfill-YYYY release (start and end in one month)
        required: false
        default: "false"

permissions:
  actions: write
  contents: write

# Shares the group with the daily run so the two never hit the API at once.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      BUNDLE: ${{ inputs.bundle }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Download finished cohorts
        run: |
          gh release view backfill > /dev/null 2>&1 || \
            gh release create backfill --title "Backfill" \
              --notes "Past cohorts collected after the fact. Page state is as of collection time, not day 1."
          mkdir -p data/backfill
          gh release download backfill --dir data/backfill --pattern "views_full_*.jsonl" || true

      - name: Backfill
        run: python -m first48.backfill "$START" "$END" --out data/backfill | tee written.txt

      - name: Upload new files
        if: always() && env.BUNDLE != 'true'
        run: |
          if [ -s written.txt ]; then
            xargs gh release upload backfill --clobber < written.txt
          fi

      # A bundle is uploaded only when the whole month finished, so a
      # bundle on the release always holds every day of its month.
      - name: Upload month bundle
        if: env.BUNDLE == 'true'
        run: |
          MONTH=${START:0:7}
          RELEASE=backfill-${START:0:4}
          gh release view $RELEASE > /dev/null 2>&1 || \
            gh release create $RELEASE --title "Backfill ${START:0:4}" \
              --notes "Past cohorts, one compressed file per month. Page state is as of collection time, not day 1."
          tar czf backfill_$MONTH.tar.gz -C data/backfill $(cd data/backfill && ls *_$MONTH-*.jsonl)
          gh release upload $RELEASE backfill_$MONTH.tar.gz --clobber

      # Runs started with the workflow token do not fire workflow_run, so ask for the next one here.
      - name: Queue the next run
        if: success()
        run: gh workflow run queue.yml -f after=${{ github.run_id }}
