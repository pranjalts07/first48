name: collect

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Download earlier snapshots
        run: |
          gh release view data > /dev/null 2>&1 || \
            gh release create data --title "Raw data" --notes "Daily raw files written by the collector."
          mkdir -p data/raw
          gh release download data --dir data/raw --pattern "snapshot_*.jsonl" || true

      - name: Collect
        run: python -m first48.collect --out data/raw --summary collector_runs.csv | tee written.txt

      - name: Upload new files
        if: always()
        run: |
          if [ -s written.txt ]; then
            xargs gh release upload data < written.txt
          fi

      - name: Shadow forecasts and monitoring
        run: |
          if [ ! -f models/meta.json ]; then exit 0; fi
          pip install -r requirements-model.txt
          gh release download data --dir data/raw --skip-existing
          python -m first48.warehouse --backfill data/none
          python -m first48.shadow predict | tee shadow_written.txt
          if [ -s shadow_written.txt ]; then
            xargs gh release upload data < shadow_written.txt
          fi
          mkdir -p monitoring
          python -m first48.shadow monitor --report monitoring

      - name: Open an issue for alerts
        run: |
          if [ -s monitoring/alerts.txt ]; then
            gh label create monitoring --color D93F0B --force
            gh issue create --title "Monitoring alert $(date -u +%F)" \
              --body-file monitoring/alerts.txt --label monitoring
          fi

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity. A commit to main each run keeps it active.
      - name: Commit run summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector_runs.csv
          git add monitoring/*.csv 2>/dev/null || true
          git commit -q -m "Collector run $(date -u +%F)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
