name: collect

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Download earlier snapshots
        run: |
          gh release view data > /dev/null 2>&1 || \
            gh release create data --title "Raw data" --notes "Daily raw files written by the collector."
          mkdir -p data/raw
          gh release download data --dir data/raw --pattern "snapshot_*.jsonl" || true

      - name: Collect
        run: python -m first48.collect --out data/raw --summary collector_runs.csv | tee written.txt

      # Edit history is read by timestamp, so a late run still records
      # exactly what was known at the end of day 1.
      - name: Edit activity for the snapshot cohort
        if: always()
        run: |
          COHORT=$(date -u -d "2 days ago" +%F)
          python -m first48.edits "$COHORT" "$COHORT" --pages data/raw --out data/raw | tee -a written.txt

      - name: Upload new files
        if: always()
        run: |
          if [ -s written.txt ]; then
            xargs gh release upload data < written.txt
          fi

      - name: Keep the run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-summary
          path: collector_runs.csv
          retention-days: 7

  forecast:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check for a frozen model
        id: model
        run: |
          if [ -f models/meta.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build the warehouse
        if: steps.model.outputs.ready == 'true'
        run: |
          pip install -r requirements.txt -r requirements-model.txt
          mkdir -p data/raw
          gh release download data --dir data/raw
          python -m first48.warehouse --backfill data/none

      - name: Shadow forecasts
        if: steps.model.outputs.ready == 'true'
        run: |
          python -m first48.shadow predict | tee shadow_written.txt
          if [ -s shadow_written.txt ]; then
            xargs gh release upload data < shadow_written.txt
          fi

      - name: Monitoring
        if: steps.model.outputs.ready == 'true'
        run: |
          mkdir -p monitoring
          python -m first48.shadow monitor --report monitoring

      - name: Keep the monitoring report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitoring
          path: monitoring
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [collect, forecast]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: run-summary
          path: .

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: monitoring
          path: monitoring

      - name: Open an issue for alerts
        env:
          COLLECT: ${{ needs.collect.result }}
          FORECAST: ${{ needs.forecast.result }}
        run: |
          mkdir -p monitoring
          if [ "$COLLECT" = "failure" ]; then
            echo "Collection failed in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> monitoring/alerts.txt
          fi
          if [ "$FORECAST" = "failure" ]; then
            echo "Shadow forecasts failed in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> monitoring/alerts.txt
          fi
          if [ -s monitoring/alerts.txt ]; then
            gh label create monitoring --color D93F0B --force
            gh issue create --title "Monitoring alert $(date -u +%F)" \
              --body-file monitoring/alerts.txt --label monitoring
          fi

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity. A commit to main each run keeps it active.
      - name: Commit run summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector_runs.csv
          git add monitoring/*.csv 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Collector run $(date -u +%F)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
